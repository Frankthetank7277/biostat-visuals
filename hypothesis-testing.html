<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypothesis Testing — Biomedical Imaging</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap');
  :root{--bg:#0a0e1a;--surface:#111827;--border:#1e293b;--accent:#f472b6;--accent2:#38bdf8;--accent3:#34d399;--text:#e2e8f0;--muted:#64748b;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:2rem;}
  h1{font-size:2rem;font-weight:800;color:var(--accent);margin-bottom:.25rem;}
  .subtitle{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.8rem;margin-bottom:2rem;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;max-width:1100px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;}
  .card h3{font-size:1rem;font-weight:700;color:var(--accent2);margin-bottom:1rem;}
  canvas{display:block;width:100%!important;}
  .full{grid-column:1/-1;}
  label{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);display:block;margin-bottom:.25rem;}
  input[type=range]{accent-color:var(--accent);width:100%;margin-bottom:.75rem;}
  .result{font-family:'JetBrains Mono',monospace;font-size:.85rem;padding:.75rem;border-radius:8px;margin-top:.75rem;border:1px solid var(--border);}
  .reject{background:#1a0a12;border-color:#f472b6;color:#f472b6;}
  .fail{background:#0a0e1a;border-color:#64748b;color:#64748b;}
  button{background:var(--border);border:1px solid var(--accent);color:var(--accent);padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.75rem;transition:all .2s;margin:.2rem;}
  button:hover,button.active{background:var(--accent);color:var(--bg);}
  .controls{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem;}
  .badge{display:inline-block;padding:.2rem .5rem;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.7rem;margin:.1rem;}
  .sig{background:#0d2a1a;color:#34d399;border:1px solid #34d399;}
  .nonsig{background:#1a1a0a;color:#f59e0b;border:1px solid #f59e0b;}
</style>
</head>
<body>
<h1>🧪 Hypothesis Testing</h1>
<p class="subtitle">// t-tests · ANOVA · Mann-Whitney · multiple comparisons · FDR</p>

<div class="grid">
  <div class="card">
    <h3>Two-Sample T-Test — Cell Intensity</h3>
    <label>Group A mean: <span id="mu1v">128</span></label>
    <input type="range" id="mu1" min="80" max="180" value="128" oninput="runTTest()">
    <label>Group B mean: <span id="mu2v">145</span></label>
    <input type="range" id="mu2" min="80" max="180" value="145" oninput="runTTest()">
    <label>Sample size n: <span id="nv">30</span></label>
    <input type="range" id="nslider" min="5" max="100" value="30" oninput="runTTest()">
    <canvas id="ttestCanvas" height="200"></canvas>
    <div id="ttestResult" class="result"></div>
  </div>

  <div class="card">
    <h3>Multiple Comparisons — p-value Correction</h3>
    <div class="controls">
      <button class="active" onclick="setCorrection('none')">None</button>
      <button onclick="setCorrection('bonferroni')">Bonferroni</button>
      <button onclick="setCorrection('fdr')">FDR (BH)</button>
    </div>
    <canvas id="pvalCanvas" height="240"></canvas>
    <div id="correctionInfo" class="result"></div>
  </div>

  <div class="card full">
    <h3>Power Analysis — Effect Size vs Sample Size</h3>
    <canvas id="powerCanvas" height="200"></canvas>
    <div style="display:flex;gap:2rem;margin-top:.75rem;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);">
      <span style="color:#f472b6">■</span> Cohen's d=0.2 (small) &nbsp;
      <span style="color:#38bdf8">■</span> d=0.5 (medium) &nbsp;
      <span style="color:#34d399">■</span> d=0.8 (large) &nbsp;
      <span style="border-top:2px dashed #64748b;display:inline-block;width:20px;vertical-align:middle"></span> 80% power threshold
    </div>
  </div>
</div>

<script>
function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function normalPDF(x,mu,sigma){return Math.exp(-0.5*((x-mu)/sigma)**2)/(sigma*Math.sqrt(2*Math.PI));}
function normalCDF(x){
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sign=x<0?-1:1; x=Math.abs(x)/Math.sqrt(2);
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return 0.5*(1+sign*y);
}
function tCDF(t,df){
  // approximation
  const x=df/(df+t*t);
  let beta=0;
  for(let i=0;i<100;i++){const xi=i/100;beta+=Math.pow(xi,df/2-1)*Math.pow(1-xi,-0.5)*0.01;}
  return 1-0.5*Math.pow(x,df/2);
}

let correctionMode='none';
let pvals=[];

function generatePVals(n=20){
  // Mix of null and alternative
  pvals=[];
  for(let i=0;i<n;i++){
    if(i<6) pvals.push(Math.random()*0.04+0.001); // true positives
    else pvals.push(Math.random()*0.95+0.04);       // nulls
  }
  pvals.sort((a,b)=>a-b);
}

function runTTest(){
  const mu1=+document.getElementById('mu1').value;
  const mu2=+document.getElementById('mu2').value;
  const n=+document.getElementById('nslider').value;
  const sigma=35;
  document.getElementById('mu1v').textContent=mu1;
  document.getElementById('mu2v').textContent=mu2;
  document.getElementById('nv').textContent=n;

  const se=sigma*Math.sqrt(2/n);
  const t=(mu2-mu1)/se;
  const df=2*(n-1);
  // two-tailed p
  const p=2*(1-normalCDF(Math.abs(t)));

  const cv=document.getElementById('ttestCanvas');
  cv.width=cv.offsetWidth||400; cv.height=200;
  const ctx=cv.getContext('2d');
  const W=cv.width, H=200, pad=30;
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,W,H);

  const lo=20, hi=240;
  const sx=v=>(v-lo)/(hi-lo)*(W-2*pad)+pad;
  const peak1=normalPDF(mu1,mu1,sigma), peak2=normalPDF(mu2,mu2,sigma);
  const maxP=Math.max(peak1,peak2);

  ['#f472b620','#38bdf820'].forEach((fill,gi)=>{
    const mu=gi===0?mu1:mu2;
    ctx.beginPath(); ctx.fillStyle=fill;
    for(let x=lo;x<=hi;x+=0.5){
      const y=H-pad-(normalPDF(x,mu,sigma)/maxP)*(H-2*pad);
      x===lo?ctx.moveTo(sx(x),H-pad):ctx.lineTo(sx(x),y);
    }
    ctx.lineTo(sx(hi),H-pad); ctx.closePath(); ctx.fill();
  });

  [['#f472b6',mu1],['#38bdf8',mu2]].forEach(([col,mu])=>{
    ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=2;
    for(let x=lo;x<=hi;x+=0.5){
      const y=H-pad-(normalPDF(x,mu,sigma)/maxP)*(H-2*pad);
      x===lo?ctx.moveTo(sx(x),H-pad):ctx.lineTo(sx(x),y);
    }
    ctx.stroke();
    ctx.beginPath(); ctx.setLineDash([4,3]); ctx.moveTo(sx(mu),H-pad); ctx.lineTo(sx(mu),20); ctx.stroke(); ctx.setLineDash([]);
  });

  ctx.fillStyle='#f472b6'; ctx.font='11px JetBrains Mono'; ctx.fillText('A',sx(mu1)-4,18);
  ctx.fillStyle='#38bdf8'; ctx.fillText('B',sx(mu2)-4,18);

  const res=document.getElementById('ttestResult');
  const sig=p<0.05;
  res.className='result '+(sig?'reject':'fail');
  res.innerHTML=`t = ${t.toFixed(3)} &nbsp;|&nbsp; df = ${df} &nbsp;|&nbsp; p = ${p.toFixed(4)}<br>${sig?'✓ Reject H₀ — significant difference (α=0.05)':'✗ Fail to reject H₀'}`;
}

function setCorrection(mode){
  correctionMode=mode;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  drawPVals();
}

function drawPVals(){
  const cv=document.getElementById('pvalCanvas');
  cv.width=cv.offsetWidth||400; cv.height=240;
  const ctx=cv.getContext('2d');
  const W=cv.width, H=240, pad=40;
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,W,H);

  const n=pvals.length;
  const alpha=0.05;
  let thresholds;
  if(correctionMode==='bonferroni') thresholds=pvals.map(()=>alpha/n);
  else if(correctionMode==='fdr') thresholds=pvals.map((_,i)=>alpha*(i+1)/n);
  else thresholds=pvals.map(()=>alpha);

  const bw=(W-2*pad)/n;
  pvals.forEach((p,i)=>{
    const sig=p<=thresholds[i];
    const barH=(1-p)*(H-2*pad);
    ctx.fillStyle=sig?'#34d39988':'#334155';
    ctx.fillRect(pad+i*bw, H-pad-barH, bw-2, barH);
    // threshold dot
    const ty=H-pad-(1-thresholds[i])*(H-2*pad);
    ctx.fillStyle='#f472b6'; ctx.fillRect(pad+i*bw,ty-1,bw-2,2);
  });

  // axes
  ctx.fillStyle='#64748b'; ctx.font='10px JetBrains Mono';
  ctx.fillText('p=0',5,H-pad); ctx.fillText('p=1',5,pad+5);
  ctx.fillText('α threshold',W-85,H-pad-3);

  const sigs=pvals.filter((p,i)=>p<=thresholds[i]).length;
  const info=document.getElementById('correctionInfo');
  info.className='result';
  info.innerHTML=`<span style="color:#34d399">Significant: ${sigs}/${n}</span> &nbsp;|&nbsp; 
    ${correctionMode==='bonferroni'?`α* = ${(alpha/n).toFixed(4)} (Bonferroni)`:correctionMode==='fdr'?`BH procedure, FDR ≤ ${alpha}`:`No correction, α = ${alpha}`}`;
}

function drawPower(){
  const cv=document.getElementById('powerCanvas');
  cv.width=cv.offsetWidth||800; cv.height=200;
  const ctx=cv.getContext('2d');
  const W=cv.width, H=200, pad=40;
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,W,H);

  const nRange=Array.from({length:100},(_,i)=>i+5);
  const effects=[{d:0.2,col:'#f472b6'},{d:0.5,col:'#38bdf8'},{d:0.8,col:'#34d399'}];

  // grid
  ctx.strokeStyle='#1e293b'; ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(t=>{ ctx.beginPath(); ctx.moveTo(pad,pad+t*(H-2*pad)); ctx.lineTo(W-pad,pad+t*(H-2*pad)); ctx.stroke(); });

  // 80% power line
  ctx.setLineDash([5,4]); ctx.strokeStyle='#64748b'; ctx.lineWidth=1;
  const y80=H-pad-0.8*(H-2*pad);
  ctx.beginPath(); ctx.moveTo(pad,y80); ctx.lineTo(W-pad,y80); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle='#64748b'; ctx.font='10px JetBrains Mono'; ctx.fillText('80%',W-pad+2,y80+4);

  effects.forEach(({d,col})=>{
    ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=2;
    nRange.forEach((n,i)=>{
      // approx power = Phi(|d|*sqrt(n/2) - z_alpha/2)
      const z=d*Math.sqrt(n/2)-1.96;
      const power=normalCDF(z);
      const x=pad+(i/(nRange.length-1))*(W-2*pad);
      const y=H-pad-power*(H-2*pad);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
  });

  // axes labels
  ctx.fillStyle='#64748b'; ctx.font='10px JetBrains Mono';
  [10,25,50,75,100].forEach(n=>{ const x=pad+((n-5)/95)*(W-2*pad); ctx.fillText(n,x-8,H-5); });
  ctx.fillText('n',W/2,H-5); ctx.fillText('Power',5,pad+5);
}

generatePVals();
runTTest(); drawPVals(); drawPower();
window.addEventListener('resize',()=>{runTTest();drawPVals();drawPower();});
</script>
</body></html>
